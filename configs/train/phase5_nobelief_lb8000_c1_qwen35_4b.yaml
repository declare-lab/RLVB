# RLVB (GRPO), Qwen3.5-4B, without the belief score: a new sample set every 5 updates, the length budget, and a length term of
# weight 1 in place of 4. It is the RLVB (GRPO) run file configs/train/grpo_posterior_qwen35_4b.yaml with the settings of
# the no-belief-score ablation: line_score none, line_wide off, line_target -1 and em_more_joint 0 (the turn score R is the
# action's log pi* only; the belief line is still written and carried, but not scored). Plus these lines:
#  phase 5, phase_set 240, set_keep 160 and beta_decay 0.9856: a new sample set every 5 updates (the method: 25),
# 240 histories in a phase's set and 160 with an accepted own turn, each drawn once by the 5 updates (the method: 300 and 200);
# the teacher's share of the moves per phase is 0.93^(1/5), the method's 0.5 and 0.465 at updates 1 and 26. A sample set that
# is used for 25 updates is too old for this model (the KL stop skipped many updates); after 5 updates the KL to the sampling
# model stays far below the limit.
#  length_budget 8000: only a thought that the cap of 8,192 tokens cuts, or that ends in the last 192 tokens before the cap,
# pays the length term; a correct thought of at most 8,000 tokens gets no length term (length_reward in plearn/method/trainer.py).
# max_think stays 8192, as in all runs. Without the budget the reasoning of this model collapsed to a few hundred tokens.
#  length_reward "1": with C = 4 a cut thought costs 2 nats while two accepted actions differ by about 0.2 nats, and most of the
#    first set's thoughts are cut; C = 1 leaves 0.5 nats for length.
# The ablation with no length term: configs/train/phase5_nobelief_nolen_qwen35_4b.yaml.
# To watch at each collection: train/think_tokens_p and train/think_truncated (the reasoning), train/answers_agent and
# train/mean_t (the answers), kl_stop_left (it should not appear).
# Train, then the standard two-line test: scripts/ablation_scripts/phase5_nobelief_lb8000_c1_qwen35_4b.sh.
train: phase5_nobelief_lb8000_c1_qwen35_4b
model: qwen3.5-4b
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/phase5_nobelief_lb8000_c1_qwen35_4b
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  phase: 5                     # a new sample set every 5 updates (the method: 25)
  phase_set: 240               # the histories of a phase's sample set (the method: 300 per phase of 25 updates)
  set_keep: 160                # the histories with an accepted own turn that the 5 updates draw from, each once (the method: 200)
  length_budget: 8000          # only a thought that is cut at 8,192 (or ends just before it) pays the length term
  length_reward: "1"           # C = 1 (the method: 4): a cut thought costs 0.5 nats, a long wrong one at most 0.5
  beta_decay: 0.9856           # the teacher's share of the moves per phase, 0.93^(1/5): the method's 0.5 and 0.465 at updates 1 and 26
  update: grpo                 # RLVB (GRPO)
  grpo_clip: 20                # scores raised to at least the group's best - 20, advantages in [-20, 20] nats
  grpo_eps: 0.2                # PPO's clip rule against the phase prior
  grpo_norm: 1                 # every batch's weights get RLVB (EM)'s total absolute size (one factor per batch)
  attn: flash_attention_3      # FlashAttention 3 for speed (checked against sdpa at the first score)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # thought sampler + decision T (METHOD 0.6)
  line_score: none
  line_wide: false
  line_target: -1
  em_more_joint: 0
wandb:
  name: "Qwen3.5-4B · RLVB (GRPO) ablation: no belief score, phase 5 / phase_set 240 / set_keep 160, length_budget 8000, length_reward 1"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
