# RLVB (GRPO) without the belief score, on-policy: new games and new sampled turns before every update.
# It is configs/train/abl_grpo_nobelief_qwen3vl_4b_thinking.yaml (the no-belief-score ablation: line_score none, line_wide off, line_target -1 and em_more_joint 0 (the turn score R is the
# action's log pi* only; the belief line is still written and carried, but not scored);
# tau 0.1 for all of pi*, no tau_look), plus four lines: phase 1, phase_set 40, set_keep 32 and beta_decay 0.9971 (the method: 25,
# 300, 200 and 0.93). Before every update the actor loads the learner's last adapter, plays a few games with it (the first update:
# 40 x worlds / B = 5 scenes, then about 30% more histories than phase_set, about 10 scenes), samples the own turns at their
# histories, and the update trains once on the first 32 histories with an accepted action (32 x 32 turns, as the method's
# updates). No sample is older than one update, as in PPO and GRPO; the method samples twice in a run. The KL stop never acts (a
# phase is one update). beta_decay 0.9971 = 0.93^(1/25): the teacher's share of the moves falls per update along the method's
# values (0.5 at update 1, 0.465 at update 26). With GPUs shared by the actor and the learner, the server stops and starts at
# every update. A collection has a fixed delay (the turns of the longest game), so the run is several times longer than the
# method's. The teacher fixes of plearn/method/trainer.py (the module text) are on.
# Train, then the standard two-line test: scripts/ablation_scripts/onpolicy_nobelief_qwen3vl_4b_thinking.sh.
train: onpolicy_nobelief_qwen3vl_4b_thinking
model: qwen3-vl-4b-thinking
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/onpolicy_nobelief_qwen3vl_4b_thinking
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  phase: 1                     # every update has its own games and sampled turns from the model before it (the method: 25)
  phase_set: 40                # the histories the games before an update are played for (the method: 300 per phase of 25 updates)
  set_keep: 32                 # the histories with an accepted own turn that the update trains on (the method: 200 per phase)
  beta_decay: 0.9971           # the teacher's share of the moves per update, 0.93^(1/25): the method's 0.5 and 0.465 at updates 1 and 26
  update: grpo                 # RLVB (GRPO)
  grpo_clip: 20                # scores raised to at least the group's best - 20, advantages in [-20, 20] nats
  grpo_eps: 0.2                # PPO's clip rule against the phase prior
  grpo_norm: 1                 # every batch's weights get RLVB (EM)'s total absolute size (one factor per batch)
  attn: flash_attention_3      # FlashAttention 3 for speed (checked against sdpa at the first score)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # thought sampler + decision T (METHOD 0.6)
  line_score: none
  line_wide: false
  line_target: -1
  em_more_joint: 0
wandb:
  name: "Qwen3-VL-4B-Thinking · RLVB (GRPO) ablation: no belief score, on-policy (new games before every update)"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
