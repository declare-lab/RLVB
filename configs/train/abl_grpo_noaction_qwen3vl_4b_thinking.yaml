# Ablation of RLVB (GRPO) with Qwen3-VL-4B-Thinking: the belief score ON, the action reward OFF, the acceptance rule OFF
# (when the action reward is off, the acceptance rule must be off too, because the acceptance rule can give an action reward by
# another way). The same run as configs/train/grpo_posterior_qwen3vl_4b_thinking.yaml (train_suite, 50 updates,
# cap 8,192, T 1.0, presence 1.5, lr 1e-5, line_score decision + line_mix 0.1, line_wide, line_target 0.1) with these changes only:
#   act_score 0         the turn score R has no action log pi*: the belief line's part only
#   accept_rule 0       a rejected action is not capped at min(A, 0); the length reward's "correct" reads the belief line only
#   accept_only 0       the weights do not need an accepted action
#   em_more 0           no extra sample round for histories without an accepted action
#   set_keep 0          no dynamic sampling on accepted actions; phase_set 200 = the 200 histories the method keeps of its 300
# Train, then the standard two-line test: scripts/ablation_scripts/abl_grpo_noaction_qwen3vl_4b_thinking.sh.
train: abl_grpo_noaction_qwen3vl_4b_thinking
model: qwen3-vl-4b-thinking
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/abl_grpo_noaction_qwen3vl_4b_thinking
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  update: grpo                 # RLVB (GRPO)
  grpo_clip: 20                # scores raised to at least the group's best - 20, advantages in [-20, 20] nats
  grpo_eps: 0.2                # PPO's clip rule against the phase prior
  grpo_norm: 1                 # every batch's weights get RLVB (EM)'s total absolute size (one factor per batch)
  attn: flash_attention_3      # FlashAttention 3 for speed (checked against sdpa at the first score)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # thought sampler + decision T (METHOD 0.6)
  line_wide: true
  line_target: 0.1
  act_score: 0
  accept_rule: 0
  accept_only: 0
  em_more: 0
  set_keep: 0                  # no dynamic sampling on accepted actions
  phase_set: 200               # the 200 histories the method keeps of its 300
wandb:
  name: "Qwen3-VL-4B-Thinking · RLVB (GRPO) ablation: no action reward"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
