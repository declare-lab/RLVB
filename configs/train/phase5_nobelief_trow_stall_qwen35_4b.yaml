# RLVB (GRPO), Qwen3.5-4B, without the belief score and without a length term, phases of 5 updates, with three reward
# repairs: rho_exact 1, teacher_row 1, stall_cap 3.5 and stall_play 1.
# It is configs/train/phase5_nobelief_trow_qwen35_4b.yaml (rho_exact 1, teacher_row 1) plus stall_cap: 3.5 and stall_play: 1.
#  stall_cap 3.5: a look that is neither one of the teacher's best looks nor one with real expected evidence (some outcome of it
#    changes the posterior of the answer), and an action that is not legal, get a teacher score of at most the best action's minus
#    3.5 nats. Without it such a step lost only its time cost (0.2 nats) and was accepted (the accept rule allows log 20 = 3.0
#    nats), so teacher_row never saw a group of stalling turns: in the phase-5 runs the agent turned left in many of its MiniGrid
#    actions and made about 30 cursor moves for 1.3 opened cells per MineSweeper game. MineSweeper: a cursor move counts only when
#    it heads for the teacher's best cell. The rule only lowers a value.
#  stall_play 1: the teacher's own moves in the training games come from the capped scores too. At tau 0.1 the teacher otherwise
#    takes a move that the cap rejects at about a third of its steps in the four navigation games; with it 3-5%, and its games are
#    shorter (MiniGrid 35 -> 10 turns).
# To watch at each collection: train/stall_rejected (own turns rejected by the cap alone), train/teacher_rows, train/mean_t (turns
# per game), train/answers_agent, train/em_left_out.
# The first sample set cannot be taken from another run (PL_SET_FROM): rho_exact and stall_play change the teacher of the games,
# and stall_cap the scores of the own turns.
# Train, then the standard two-line test: scripts/ablation_scripts/phase5_nobelief_trow_stall_qwen35_4b.sh.
train: phase5_nobelief_trow_stall_qwen35_4b
model: qwen3.5-4b
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/phase5_nobelief_trow_stall_qwen35_4b
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  phase: 5                     # a new sample set every 5 updates (the method: 25)
  phase_set: 240               # the histories of a phase's sample set (the method: 300 per phase of 25 updates)
  set_keep: 160                # the histories with an accepted own turn that the 5 updates draw from, each once (the method: 200)
  length_budget: 8000          # only a thought that is cut at 8,192 (or ends just before it) pays the length term
  length_reward: "0"           # no length term (the method: 4); length_budget then has no effect
  rho_exact: 1                 # the answer accuracy of the teacher is the exact posterior (the table is not updated)
  teacher_row: 1               # the teacher's line and action join a group with no accepted own turn (no limit on its advantage: teacher_row_cap 0)
  stall_cap: 3.5               # a stalling look or an action that is not legal: at most the best action's log pi* minus 3.5 nats (rejected)
  stall_play: 1                # the teacher's own moves (tgt) from the capped scores too
  beta_decay: 0.9856           # the teacher's share of the moves per phase, 0.93^(1/5): the method's 0.5 and 0.465 at updates 1 and 26
  update: grpo                 # RLVB (GRPO)
  grpo_clip: 20                # scores raised to at least the group's best - 20, advantages in [-20, 20] nats
  grpo_eps: 0.2                # PPO's clip rule against the phase prior
  grpo_norm: 1                 # every batch's weights get RLVB (EM)'s total absolute size (one factor per batch)
  attn: flash_attention_3      # FlashAttention 3 for speed (checked against sdpa at the first score)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # thought sampler + decision T (METHOD 0.6)
  line_score: none
  line_wide: false
  line_target: -1
  em_more_joint: 0
wandb:
  name: "Qwen3.5-4B · RLVB (GRPO) ablation: no belief score, phase 5 / phase_set 240 / set_keep 160, no length term, rho_exact 1, teacher_row 1, stall_cap 3.5, stall_play 1"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
