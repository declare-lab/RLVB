# RLVB (GRPO) without the belief score, with a 4 times larger sample set per phase ("RLVB (GRPO), pooled"), Qwen3.5-4B.
# It is the RLVB (GRPO) run file configs/train/grpo_posterior_qwen35_4b.yaml with the settings of
# the no-belief-score ablation: line_score none, line_wide off, line_target -1 and em_more_joint 0 (the turn score R is the
# action's log pi* only; the belief line is still written and carried, but not scored);
# tau 0.1 for all of pi*, no tau_look; configs/train/abl_grpo_nobelief_qwen3vl_4b_thinking.yaml on the 4B-VL. Plus two lines:
# phase_set 1200 and set_keep 800 (the method: 300 and 200). A phase has 25 updates of 32 histories = 800 draws, so
# with 800 kept histories every update draws histories that it did not use before (with 200: each history about 4 times).
# The actor plays about 4 times more games for it (the first set: 1200 x worlds / B = 150 scenes, then about 30% more
# histories than phase_set) and samples the own turns at 1200 histories per phase, so each of the 2 collections takes about
# 4 times longer. If the first set has fewer than 800 histories with an accepted action, its histories repeat (passes).
# The teacher fixes of plearn/method/trainer.py (the module text) are on.
# Train, then the standard two-line test: scripts/ablation_scripts/pool_nobelief_qwen35_4b.sh.
train: pool_nobelief_qwen35_4b
model: qwen3.5-4b
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/pool_nobelief_qwen35_4b
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  phase_set: 1200              # the histories of a phase's sample set (the method: 300)
  set_keep: 800                # the histories with an accepted own turn that the 25 updates draw from (the method: 200)
  update: grpo                 # RLVB (GRPO)
  grpo_clip: 20                # scores raised to at least the group's best - 20, advantages in [-20, 20] nats
  grpo_eps: 0.2                # PPO's clip rule against the phase prior
  grpo_norm: 1                 # every batch's weights get RLVB (EM)'s total absolute size (one factor per batch)
  attn: flash_attention_3      # FlashAttention 3 for speed (checked against sdpa at the first score)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # thought sampler + decision T (METHOD 0.6)
  line_score: none
  line_wide: false
  line_target: -1
  em_more_joint: 0
wandb:
  name: "Qwen3.5-4B · RLVB (GRPO) ablation: no belief score, phase_set 1200 / set_keep 800"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
