# Qwen3.5-4B RLVB (EM) (scripts/pl_qwen35_4b.sh): configs/train/suite_qwen35_4b_presence.yaml with the training's thinking cap = the
# tests' 8,192 (METHOD: 16,384 in training), line_wide and line_target 0.1. The test protocol does not change (the same prompt,
# presence penalty 1.5, cap 8,192). With the cap 16,384, most of the base model's thoughts on Mastermind prompts were longer
# than 8,192 tokens, so the training fitted thoughts that a test cuts. PL_GPUS sets the GPUs; the gradient is summed over the
# learner's ranks, so the update is the same for any count.
# The method is METHOD in plearn/train.py (phase 25, phase_set 300, set_keep 200, B 32, line_score decision, length_reward 4,
# lr 1e-5, kl_stop 0.015, dec_term own) with presence penalty 1.5 and temperature 1.0, 50 updates (adapter_25, adapter_50).
# The 4B has an MTP head; the 8B run has no MTP, so this run has none (no PL_VLLM_SPEC). The weights: QWEN35_4B_PATH, else
# $PL_MODELS/Qwen3.5-4B or $PL_MODELS/Qwen35-4B (configs/models/qwen3.5-4b.yaml).
train: suite_qwen35_4b_presence_8k
model: qwen3.5-4b
train_tasks: train_suite              # HiddenGames, the 8 games (train split)
eval_tasks: [train_suite]             # the validation split of the training tasks (deferred: PL_EVAL_DEFER)
eval_n: 0
output: ${PL_RUNS:-runs}/suite_qwen35_4b_presence_8k
env_sh: ${PL_ENV_SH:-/dev/null}
gpus: {actor: "${PL_GPUS:-0,1,2,3}", learner: "${PL_GPUS:-0,1,2,3}", colocate: true}
server:
  PL_PRESENCE_PENALTY: "1.5"   # the model card setting
  PL_EVAL_DEFER: "1"           # no validation in training: the runs test after training; eval_every still saves the adapters
  PL_SKIP_EVAL0: "1"
  PL_GPUS_PER_SERVER: "1"      # as the 8B: 1 GPU a server, no MTP
  PL_MAX_NUM_SEQS: "${PL_SEQS:-96}"
  PL_M_SPLIT: item             # speed
  PL_ROUTE_SPILL: "2"
  PL_ROUTE_SPILL_MIN: "96"
method:
  line_wide: true              # the mirror term: a line wider than the exact line pays line_floor x its excluded share
  line_target: 0.1             # a belief line is an M-step target only within 0.1 nats of the teacher's best line; else the turn trains its action only
  steps: 50
  eval_every: 25
  eval_split: validation
  worlds: 4
  temperature: 1.0             # as the 8B run (thought sampler + decision T; METHOD 0.6)
  score_presence: 1            # the learner's score has the sampler's presence penalty (PL_PRESENCE_PENALTY above)
  max_think: 8192              # the tests' cap in training too (METHOD: 16,384 in training)
wandb:
  name: "4B PL Transfer presence score cap 8192"
  project: ${WANDB_PROJECT:-}
  entity: ${WANDB_ENTITY:-}
  group: suite
